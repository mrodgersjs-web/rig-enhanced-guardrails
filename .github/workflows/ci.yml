name: CI
on:
  push:
    branches: [main, ghup/**]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: "Test (fast path, no coverage)"
        # Coverage was observed to hang in some environments; the
        # dedicated coverage step below runs coverage run -m pytest
        # in its own subprocess so a hung coverage run is caught by
        # the step's own timeout-minutes instead of holding the
        # whole job open. This first invocation runs pytest in its
        # normal mode and gates the build on tests passing.
        run: python3 -m pytest -q
      - name: Coverage (subprocess wrapper)
        # coverage run -m pytest is the proven fallback when the
        # pytest --cov plugin hangs. The 12-minute step timeout is
        # set explicitly so a stuck coverage subprocess is killed
        # cleanly instead of running until the job's 15-minute
        # timeout.
        timeout-minutes: 12
        run: |
          coverage run --source=src -m pytest -q
          coverage report -m
